bindsym $mod+Shift+x exec "swaymsg output eDP-1 disable; swaymsg output HDMI-A-1 resolution 1920x1080 position 0 0"
bindsym $mod+b exec $browser 
bindsym $mod+f exec $file_manager 
bindsym Print exec ~/dotfiles/.bin/screenshot
bindsym $mod+return exec $terminal 
bindsym $mod+space exec rofi -show drun
# bindsym $mod+shift+b exec gammastep -l 0:0 -O 4500:4500
bindsym $mod+q kill
bindsym $mod+n exec swaync-client -t

# BRIGHTNESS
bindsym XF86MonBrightnessUp exec swayosd-client --brightness +5
bindsym XF86MonBrightnessDown exec swayosd-client --brightness -5

# VOLUME
bindsym XF86AudioRaiseVolume exec swayosd-client --output-volume +5
bindsym XF86AudioLowerVolume exec swayosd-client --output-volume -5

# OUTPUT MUTE
bindsym XF86AudioMute exec swayosd-client --output-volume mute-toggle

# MICROPHONE MUTE
bindsym F4 exec wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle && swayosd-client --input-volume mute-toggle

# change focus
bindsym $mod+h focus left
bindsym $mod+j focus down
bindsym $mod+k focus up
bindsym $mod+l focus right

# move focused window
bindsym $mod+Shift+h move left
bindsym $mod+Shift+j move down
bindsym $mod+Shift+k move up
bindsym $mod+Shift+l move right
bindsym $mod+m fullscreen toggle

# change container layout (stacked, tabbed, toggle split)
bindsym $mod+s layout stacking
bindsym $mod+w layout tabbed
bindsym $mod+e layout toggle split

# toggle tiling / floating
bindsym $mod+Shift+space floating toggle
# change focus between tiling / floating windows
bindsym $mod+v focus mode_toggle

# focus the parent container
bindsym $mod+a focus parent


# switch to workspace
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9
bindsym $mod+0 workspace number 10

# Move current container to workspace N
bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8
bindsym $mod+Shift+9 move container to workspace number 9
bindsym $mod+Shift+0 move container to workspace number 10

# reload the configuration file
bindsym $mod+Shift+r reload
bindsym $mod+Shift+e exec "swaynag -t warning -m 'Are you sure you want to exit Sway?' -b 'Yes, exit Sway' 'swaymsg exit'"
mode "resize" {
        bindsym j resize shrink width 10 px or 10 ppt
        bindsym k resize grow width 10 px or 10 ppt

        # same bindings, but for the arrow keys
        bindsym Left resize shrink width 10 px or 10 ppt
        bindsym Down resize grow height 10 px or 10 ppt
        bindsym Up resize shrink height 10 px or 10 ppt
        bindsym Right resize grow width 10 px or 10 ppt

        # back to normal: Enter or Escape or $mod+r
        bindsym Return mode "default"
        bindsym Escape mode "default"
        bindsym $mod+r mode "default"
}

bindsym $mod+r mode "resize"
