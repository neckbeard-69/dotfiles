# ========== Core Settings ==========
unbind C-b
set -g prefix None 
set -g mouse on
set -g focus-events on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:Tc"
set -g terminal-overrides ',*:kLFT5=\EL'
set -g base-index 1
set -g set-clipboard on
set -g detach-on-destroy off
set -g escape-time 0
set -g history-limit 1000000
set -g status-interval 3
set -g allow-passthrough on
set -g status-position top
setw -g mode-keys vi

set -g pane-border-lines simple
set -g pane-border-style fg=grey,dim
set -g pane-active-border-style fg=green
set -g window-style 'fg=#6c7086'
set -g window-active-style 'fg=#cdd6f4'

# ========== Reload Config ==========
bind -n M-R source-file ~/dotfiles/tmux/.config/tmux/tmux.conf \; display-message "Reloaded!"

source-file ~/dotfiles/tmux/.config/tmux/tmux.keybinds.conf


# ========== Theme ==========
bg="#1F1F28"
default_fg="#DCD7BA"
session_fg="#7E9CD8"
session_selection_fg="#1F1F28"
session_selection_bg="#7E9CD8"
active_window_fg="#98BB6C"
# active_pane_border="#3e4452"

set -g status-left-length 200
set -g status-right-length 200
set -g status-left "#[fg=${session_fg},bold,bg=${bg}]   #S #[fg=${default_fg},nobold,bg=${bg}]#{?@keylocker-status,🔒,} | "
set -g status-justify left
set -g status-style "bg=${bg}"
set -g window-status-format "#[fg=${default_fg},bg=default] #I:#W"
set -g window-status-current-format "#[fg=${active_window_fg},bold,bg=default]  #[underscore]#I:#W"
set -g window-status-last-style "fg=${default_fg},bg=default"
set -g message-command-style "bg=default,fg=${default_fg}"
set -g message-style "bg=default,fg=${default_fg}"
set -g mode-style "bg=${session_selection_bg},fg=${session_selection_fg}"
# set -g pane-active-border-style "fg=${active_pane_border},bg=default"
# set -g pane-border-style "fg=#3b4261,bg=default"

# Toggle key lock
set -g @keylocker-toggle-bind 'M-g'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'thesast/tmux-keylocker'

run '~/.config/tmux/plugins/tpm/tpm'
